name: Demo harness bug
description: The demo mail sandbox itself is broken — not KyPost running on top of it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        **Never report a security vulnerability here.** Use
        [Security Advisories](https://github.com/Busness-app/kypost-demo-IMAP/security/advisories/new)
        — this harness holds a tunnel token and a reset token, and a public issue
        discloses a live weakness before a fix exists.


        **Read this first, it saves you a round trip.** This repository is the
        disposable IMAP/SMTP/CardDAV sandbox the public demo runs against. If you
        hit something at demo.kypost.org that is about *mail behaviour* — a
        message not labelled, pairing failing, PGP, the web UI — that is
        **KyPost-Server**, not here.


        File here when the sandbox is at fault: it will not start, the seeded
        corpus is wrong or missing, TLS between the sandbox and the server fails,
        or the demo persona's mailbox is in a bad state.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected instead
    validations: {required: true}
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it?
      options:
        - "The public demo at demo.kypost.org"
        - "Running this harness myself"
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: {required: true}

  - type: input
    id: build
    attributes:
      label: Which build was running?
      description: >-
        `KYPOST_VERSION` from your `.env`, and the commit of this repository.
        docker-compose.yml pins the server by a floating `${KYPOST_VERSION:-stable}`
        tag, so "stable" means different things on different days — a "would not
        start" or "corpus is wrong" report is not reproducible without it. For the
        public demo, say so and the maintainer will fill it in.
      placeholder: "KYPOST_VERSION=0.3.0, harness commit 57b95a8"
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Name the service — `docker compose logs kypost-demo-mail`. Plain
        `docker compose logs` includes the `cloudflared` container, whose
        environment carries `CLOUDFLARED_TUNNEL_TOKEN`; `.env` also holds
        `RESET_TOKEN` and `DEMO_PASSWORD`. Those are named here because "redact
        before pasting" only works on things you recognise, and a tunnel token
        in a log line does not look like a secret.
      render: text
